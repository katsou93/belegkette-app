name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Typen zuerst: der schnellste Test, der die meisten Fehler findet.
      - name: Typen
        run: npm run typecheck

      # Die Migrationen laufen gegen ein echtes Postgres (PGlite, WASM).
      # Kein Dienstcontainer, keine Zugangsdaten, kein Netz nötig.
      - name: Datenbank und Tests
        run: npm test
